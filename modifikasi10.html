<html>
<head><title>Belajar Javascript Platform</title></head>
<body>
<h1>Perulangan Angka</h1>
<button onclick="perulangan()">TTOMBOL</button>
<div id="hasil"></div>
<script>
function perulangan() {
    var text = "";
    for (var x = 1; x <= 5; x++) {
        text += "Nomor " + x + "<br>";
    }
    document.getElementById("hasil").innerHTML = text;
}
</script>
</body>
</html>
