<html>
<head><title>Belajar Javascript Platform</title></head>
<body>
<h1>Tipe Data Pada Javascript</h1>
<div id="hasil"></div>
<script>
var angka = 95;
var kalimat = "Ayo belajar JavaScript";
var hewan = ["Kambing", "Bebek", "Ayam"];
var manusia = {
    nama: "Budi",
    alamat: "Yogyakarta",
    umur: 20,
    pekerjaan: "Mahasiswa"
};
document.getElementById("hasil").innerHTML =
    "Angka: " + angka + "<br>" +
    "Kalimat: " + kalimat + "<br>" +
    "Hewan: " + hewan[1] + "<br>" +
    manusia.nama + " tinggal di " + manusia.alamat +
    " dan bekerja sebagai " + manusia.pekerjaan;
</script>
</body>
</html>
